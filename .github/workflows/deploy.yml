name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push to the default branch.
# One-time setup: Repo → Settings → Pages → "Build and deployment" → Source: "GitHub Actions".

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Whitelist copy: only public site files are deployed. Internal files
      # (scripts/, data/, .claude/, README.md, package.json, workflow files)
      # must never reach the live domain.
      - name: Assemble site artifact
        run: |
          mkdir -p _site/assets
          cp index.html contact.html privacy.html terms.html about.html _site/
          cp sitemap.xml robots.txt ads.txt CNAME .nojekyll _site/
          cp -r athlete athletes team guide guides _site/
          cp -r assets/css assets/js assets/img _site/assets/
          mkdir -p _site/assets/data
          cp assets/data/athletes-index.json _site/assets/data/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

